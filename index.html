<!DOCTYPE html>
<!-- Tipo de documento: HTML5 -->
<html lang="es">
<!-- Idioma del contenido: Español -->

<head>
    <!-- ========== METADATOS ========== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FARMACIAS ADN</title>

    <!-- ========== FAVICON ========== -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- ========== RECURSOS EXTERNOS ========== -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- ========== PROTECCIÓN CONTRA INSPECCIÓN (disuasión) ========== -->
    <script>
        // Bloquear menú contextual (clic derecho)
        document.addEventListener('contextmenu', e => e.preventDefault());

        // Bloquear atajos comunes de inspección
        document.addEventListener('keydown', e => {
            // F12
            if (e.key === 'F12') return e.preventDefault();
            // Ctrl+Shift+I / J / C
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) {
                return e.preventDefault();
            }
            // Ctrl+U (ver código fuente)
            if (e.ctrlKey && e.key.toUpperCase() === 'U') return e.preventDefault();
            // Ctrl+S (guardar página)
            if (e.ctrlKey && e.key.toUpperCase() === 'S') return e.preventDefault();
        });
    </script>

    <style>
        /* =====================================================
           VARIABLES GLOBALES — ESTILO APPLE (TONOS CLAROS)
           ===================================================== */
        :root {
            --fondo: #F5F5F7;
            --tarjeta: #FFFFFF;
            --texto-principal: #1D1D1F;
            --texto-secundario: #6E6E73;
            --acento: #0071E3;
            --acento-hover: #0077ED;
            --borde: #D2D2D7;

            --danger: #FF3B30;
            --glow-acento: rgba(0, 113, 227, 0.18);

            --relleno-input: #FFFFFF;
            --cristal: rgba(255, 255, 255, 0.86);
            --cristal-borde: rgba(255, 255, 255, 0.70);
            --cristal-sombra: 0 4px 20px rgba(31, 60, 110, 0.14), 0 30px 70px rgba(31, 60, 110, 0.28);

            --radio-suave: 12px;
            --radio-tarjeta: 28px;
            --radio-boton: 980px;

            --transicion: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            --curva-apple: cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* =====================================================
           BASE GENERAL
           ===================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--texto-principal);
            line-height: 1.47;
            font-weight: 400;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* =====================================================
           PANTALLA DE INICIO DE SESIÓN — FONDO #70ABFF
           ===================================================== */
        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #70ABFF;
            transition: opacity 0.5s var(--curva-apple), visibility 0.5s var(--curva-apple);
        }
        .login-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .login-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(120% 90% at 50% 15%, rgba(255, 255, 255, 0.70) 0%, rgba(112, 171, 255, 0.55) 65%, rgba(112, 171, 255, 0.85) 100%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(112, 171, 255, 0.40) 100%);
            z-index: 1;
        }

        /* =====================================================
           TARJETA DE LOGIN — VIDRIO ESMERILADO CLARO
           ===================================================== */
        .login-card {
            --cristal: rgba(255, 255, 255, 0.88);
            --cristal-borde: rgba(255, 255, 255, 0.75);
            --cristal-sombra: 0 4px 20px rgba(31, 60, 110, 0.16), 0 30px 70px rgba(31, 60, 110, 0.30);

            position: relative;
            z-index: 2;
            width: 420px;
            max-width: 92vw;
            background: var(--cristal);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            backdrop-filter: saturate(180%) blur(30px);
            border: 1px solid var(--cristal-borde);
            border-radius: var(--radio-tarjeta);
            padding: 48px 40px 44px;
            box-shadow: var(--cristal-sombra);
            animation: loginSlideUp 0.75s var(--curva-apple) forwards;
            opacity: 0;
            transform: translateY(26px) scale(0.98);
        }

        @keyframes loginSlideUp {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* =====================================================
           LOGO — SOLO TIPOGRAFÍA
           ===================================================== */
        .login-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 26px;
        }
        .logo-adn {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: fit-content;
            color: var(--texto-principal);
            user-select: none;
            line-height: 1;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .logo-adn-top {
            width: 112%;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 0 1px 6px;
            border-bottom: 3.5px solid currentColor;
        }
        .logo-adn-bottom {
            display: flex;
            justify-content: space-between;
            font-size: 88px;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.88;
            margin-top: 6px;
            padding: 0 1px;
            -webkit-text-stroke: 3px currentColor;
            paint-order: stroke fill;
            transform: scaleX(1.12);
            transform-origin: center center;
        }

        /* =====================================================
           TÍTULOS Y TEXTOS DEL LOGIN
           ===================================================== */
        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.015em;
            color: var(--texto-principal);
            margin-bottom: 34px;
            font-family: inherit;
        }

        /* =====================================================
           CAMPOS DE ENTRADA DEL LOGIN
           ===================================================== */
        .login-field {
            margin-bottom: 18px;
            position: relative;
        }
        .login-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--texto-secundario);
            margin-bottom: 8px;
            letter-spacing: 0.01em;
            text-transform: none;
        }

        .login-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .login-input-wrapper .material-icons {
            position: absolute;
            font-size: 20px;
            color: var(--texto-secundario);
            pointer-events: none;
            transition: color 0.25s var(--transicion);
            z-index: 1;
        }
        .login-input-wrapper .material-icons.person { left: 15px; }
        .login-input-wrapper .material-icons.lock   { left: 15px; }
        .login-input-wrapper .material-icons.eye {
            right: 15px;
            cursor: pointer;
            pointer-events: auto;
            color: var(--texto-secundario);
            user-select: none;
            transition: color 0.2s ease, opacity 0.2s ease;
        }
        .login-input-wrapper .material-icons.eye:hover { color: var(--texto-principal); }

        .login-field input {
            width: 100%;
            padding: 14px 46px 14px 46px;
            border: 1px solid var(--borde);
            border-radius: var(--radio-suave);
            font-size: 17px;
            font-family: inherit;
            color: var(--texto-principal);
            background: var(--relleno-input);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .login-field input::placeholder {
            color: var(--texto-secundario);
            opacity: 0.75;
        }
        .login-field input:focus {
            border-color: var(--acento);
            box-shadow: 0 0 0 3px var(--glow-acento);
        }
        .login-field:focus-within .material-icons.person,
        .login-field:focus-within .material-icons.lock { color: var(--acento); }

        /* =====================================================
           RECORDAR CONTRASEÑA — CHECKBOX ESTILO APPLE
           ===================================================== */
        .login-remember {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 2px 0 6px;
            padding: 4px 2px;
            width: fit-content;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .login-remember input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .checkbox-box {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid var(--borde);
            border-radius: 6px;
            background: #FFFFFF;
            transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .checkbox-box .material-icons {
            font-size: 15px;
            line-height: 1;
            color: #FFFFFF;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.2s var(--curva-apple), transform 0.2s var(--curva-apple);
        }
        .checkbox-text {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -0.005em;
            color: var(--texto-secundario);
            transition: color 0.2s ease;
        }
        .login-remember:hover .checkbox-text { color: var(--texto-principal); }
        .login-remember:hover .checkbox-box { border-color: #A1A1A6; }

        .login-remember input:checked + .checkbox-box {
            background: var(--acento);
            border-color: var(--acento);
        }
        .login-remember input:checked + .checkbox-box .material-icons {
            opacity: 1;
            transform: scale(1);
        }
        .login-remember input:checked ~ .checkbox-text { color: var(--texto-principal); }
        .login-remember input:focus-visible + .checkbox-box {
            box-shadow: 0 0 0 3px var(--glow-acento);
        }

        /* =====================================================
           BOTÓN DE INICIAR SESIÓN
           ===================================================== */
        .login-btn {
            width: 100%;
            padding: 14px 22px;
            background: var(--acento);
            color: #FFFFFF;
            border: none;
            border-radius: var(--radio-boton);
            font-size: 17px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            letter-spacing: 0;
            text-transform: none;
            transition: var(--transicion);
            margin-top: 12px;
            -webkit-appearance: none;
            appearance: none;
        }
        .login-btn:hover { background: var(--acento-hover); transform: scale(1.01); }
        .login-btn:active { transform: scale(0.985); opacity: 0.92; }
        .login-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--glow-acento); }
        .login-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }

        /* =====================================================
           CONTENEDOR PRINCIPAL (IFRAME)
           ===================================================== */
        .app-container {
            position: fixed;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s var(--curva-apple) 0.1s, visibility 0.5s var(--curva-apple) 0.1s;
        }
        .app-container.visible { opacity: 1; visibility: visible; }
        .app-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--fondo);
            display: block;
            position: relative;
            z-index: 0;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */
        @media (max-width: 480px) {
            .login-card { padding: 40px 26px 36px; border-radius: 24px; }
            .logo-adn { transform: scale(0.86); transform-origin: center center; margin: -6px 0; }
            .login-title { font-size: 24px; margin-bottom: 28px; }
        }

        /* =====================================================
           ACCESIBILIDAD — MOVIMIENTO REDUCIDO
           ===================================================== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
            .login-card { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         PANTALLA DE INICIO DE SESIÓN
         ===================================================== -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">

            <div class="login-logo">
                <div class="logo-adn" role="img" aria-label="Farmacias ADN">
                    <div class="logo-adn-top">
                        <span>F</span><span>A</span><span>R</span><span>M</span><span>A</span><span>C</span><span>I</span><span>A</span><span>S</span>
                    </div>
                    <div class="logo-adn-bottom">
                        <span>A</span><span>D</span><span>N</span>
                    </div>
                </div>
            </div>

            <h1 class="login-title">INICIAR SESION</h1>

            <div class="login-field">
                <label for="usuario">Usuario</label>
                <div class="login-input-wrapper">
                    <input type="text" id="usuario" placeholder="Escribe tu usuario" autocomplete="username">
                    <span class="material-icons person">person</span>
                </div>
            </div>

            <div class="login-field">
                <label for="password">Contraseña</label>
                <div class="login-input-wrapper">
                    <input type="password" id="password" placeholder="Escribe tu contraseña" autocomplete="current-password">
                    <span class="material-icons lock">lock</span>
                    <span class="material-icons eye" id="togglePassword">visibility</span>
                </div>
            </div>

            <label class="login-remember" id="rememberLabel">
                <input type="checkbox" id="recordar">
                <span class="checkbox-box"><span class="material-icons" aria-hidden="true">check</span></span>
                <span class="checkbox-text">Recordar contraseña</span>
            </label>

            <button class="login-btn" id="loginBtn" onclick="iniciarSesion()">
                Iniciar Sesión
            </button>
        </div>
    </div>

    <!-- =====================================================
         CONTENIDO PRINCIPAL: IFRAME
         ===================================================== -->
    <div class="app-container" id="appContainer">
        <iframe id="marco" name="marco" src="about:blank" title="Contenido principal"></iframe>
    </div>

    <!-- =====================================================
         CÓDIGO JAVASCRIPT
         ===================================================== -->
    <script>
        /* =============================================
           CREDENCIALES DE USUARIO
           ============================================= */
        const CREDENCIALES = [
            { user: 'ivxn',   pass: '2705'  },
            { user: 'c',   pass: '1'  },
            { user: 'jose',   pass: 'a2011' },
            { user: 'JOSE',   pass: 'A2011' },
            { user: 'carlos', pass: 'c1'    },
            { user: 'carlos', pass: 'C1'    }
        ];

        /* =============================================
           MÓDULO QUE SE ABRE AL INICIAR SESIÓN
           ============================================= */
        const MODULO_INICIAL = 'articulos.html';

        /* =============================================
           CLAVE DE ALMACENAMIENTO — "RECORDAR CONTRASEÑA"
           ============================================= */
        const CLAVE_RECUERDO = 'adn_recordar_sesion';

        const inputUsuario  = document.getElementById('usuario');
        const inputPassword = document.getElementById('password');
        const chkRecordar   = document.getElementById('recordar');

        const loginOverlay = document.getElementById('loginOverlay');
        const appContainer = document.getElementById('appContainer');
        const marco        = document.getElementById('marco');

        let moduloActual = null;

        const ESTILO_ERROR = {
            borderColor: 'var(--danger)',
            boxShadow: '0 0 0 4px rgba(255, 59, 48, 0.15)'
        };

        function marcarError(el) {
            el.style.borderColor = ESTILO_ERROR.borderColor;
            el.style.boxShadow   = ESTILO_ERROR.boxShadow;
        }
        function limpiarError(el) {
            el.style.borderColor = '';
            el.style.boxShadow   = '';
        }
        function limpiarErroresDiferidos() {
            setTimeout(() => {
                limpiarError(inputUsuario);
                limpiarError(inputPassword);
            }, 2000);
        }

        /* =============================================
           RECUERDO DE CREDENCIALES
           ============================================= */
        function leerRecuerdo() {
            try {
                const crudo = localStorage.getItem(CLAVE_RECUERDO);
                if (!crudo) return null;
                const datos = JSON.parse(crudo);
                if (!datos || !datos.user) return null;
                return datos;
            } catch (e) {
                return null;
            }
        }

        function guardarRecuerdo(user, pass) {
            try {
                localStorage.setItem(CLAVE_RECUERDO, JSON.stringify({ user, pass }));
            } catch (e) { /* almacenamiento no disponible */ }
        }

        function borrarRecuerdo() {
            try {
                localStorage.removeItem(CLAVE_RECUERDO);
            } catch (e) { /* almacenamiento no disponible */ }
        }

        function cargarRecuerdoEnFormulario() {
            const datos = leerRecuerdo();
            if (!datos) return;
            inputUsuario.value  = datos.user;
            inputPassword.value = datos.pass || '';
            chkRecordar.checked = true;
        }

        /* =============================================
           FUNCIÓN DE INICIO DE SESIÓN
           ============================================= */
        function iniciarSesion() {
            const usuario  = inputUsuario.value.trim();
            const password = inputPassword.value.trim();

            let hayError = false;

            if (!usuario)  { marcarError(inputUsuario);  hayError = true; } else limpiarError(inputUsuario);
            if (!password) { marcarError(inputPassword); hayError = true; } else limpiarError(inputPassword);

            if (hayError) { limpiarErroresDiferidos(); return; }

            const usuarioNormalizado = usuario.toLowerCase();
            const esValido = CREDENCIALES.some(cred =>
                cred.user.toLowerCase() === usuarioNormalizado && cred.pass === password
            );

            if (!esValido) {
                alert('Usuario o contraseña incorrectos. Intenta de nuevo.');
                marcarError(inputUsuario);
                marcarError(inputPassword);
                limpiarErroresDiferidos();
                return;
            }

            // Guardar o borrar el recuerdo según la casilla
            if (chkRecordar.checked) {
                guardarRecuerdo(usuario, password);
            } else {
                borrarRecuerdo();
            }

            // Sesión válida → abrir directamente el módulo de artículos
            abrirModulo();
        }

        /* =============================================
           ABRIR EL MÓDULO DIRECTAMENTE (SIN MENÚ NI TOP BAR)
           ============================================= */
        function abrirModulo() {
            loginOverlay.classList.add('hidden');
            appContainer.classList.add('visible');
            moduloActual = MODULO_INICIAL;
            marco.src = MODULO_INICIAL;
        }

        /* =============================================
           CERRAR SESIÓN (disponible por si se necesita desde consola)
           ============================================= */
        function cerrarSesion() {
            appContainer.classList.remove('visible');
            marco.src = 'about:blank';
            moduloActual = null;

            loginOverlay.classList.remove('hidden');

            // Restaurar los campos según lo que se haya recordado
            const datos = leerRecuerdo();
            if (datos) {
                inputUsuario.value  = datos.user;
                inputPassword.value = datos.pass || '';
                chkRecordar.checked = true;
                inputPassword.focus();
            } else {
                inputUsuario.value  = '';
                inputPassword.value = '';
                chkRecordar.checked = false;
                inputUsuario.focus();
            }
        }
        // Para usar: escribe  cerrarSesion()  en la consola del navegador.

        /* =============================================
           MOSTRAR/OCULTAR CONTRASEÑA
           ============================================= */
        document.getElementById('togglePassword').addEventListener('click', function () {
            const tipo = inputPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            inputPassword.setAttribute('type', tipo);
            this.textContent = tipo === 'password' ? 'visibility' : 'visibility_off';
        });

        /* =============================================
           LOGIN CON TECLA ENTER
           ============================================= */
        inputPassword.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') iniciarSesion();
        });
        inputUsuario.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') inputPassword.focus();
        });

        /* =============================================
           SI SE DESMARCA "RECORDAR", BORRAR EL RECUERDO
           ============================================= */
        chkRecordar.addEventListener('change', function () {
            if (!this.checked) borrarRecuerdo();
        });

        /* =============================================
           INICIALIZACIÓN
           ============================================= */
        cargarRecuerdoEnFormulario();
        if (!inputUsuario.value) inputUsuario.focus();
    </script>
</body>
</html>
