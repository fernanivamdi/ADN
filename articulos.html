<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CONSULTA</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="db.js"></script>
    <style>
/* =====================================================
   ARTICULOS — MOBILE FIRST (base = movil, >=901px = escritorio)
   ===================================================== */
:root {
    --fondo: #F2F3F7;
    --fondo-suave: #F5F5F7;
    --tarjeta: #FFFFFF;
    --tarjeta-suave: #FAFAFC;

    --texto-principal: #16181D;
    --texto-secundario: #6B6F76;
    --texto-terciario: #9A9EA6;

    --acento: #0071E3;
    --acento-hover: #0077ED;
    --acento-suave: #EAF3FE;
    --acento-borde: #CFE2FA;
    --acento-texto: #0A4B9E;
    --acento-anillo: rgba(0,113,227,0.20);

    --borde: #E3E3E8;
    --borde-suave: #ECECF0;

    --exito: #34C759; --exito-suave: #E8F9EE; --exito-borde: #C8EED5; --exito-texto: #1A7A3A;
    --alerta: #FF9500; --alerta-suave: #FFF7E8; --alerta-borde: #FFE3B8; --alerta-texto: #8A5000;
    --peligro: #FF3B30; --peligro-suave: #FFEEEC; --peligro-borde: #FFD1CD; --peligro-texto: #B02A21;

    --sombra-tarjeta: 0 1px 2px rgba(16,24,40,0.04), 0 6px 16px rgba(16,24,40,0.06);
    --sombra-md: 0 8px 24px rgba(16,24,40,0.10);

    --radio-suave: 12px;
    --radio-medio: 18px;
    --radio-tarjeta: 18px;
    --radio-boton: 980px;

    --vidrio: rgba(255,255,255,0.80);
    --vidrio-linea: rgba(0,0,0,0.07);

    --header-h: 56px;
    --menu-reserva: 46px;

    --transicion: all 0.25s cubic-bezier(0.25,0.1,0.25,1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto-principal);
    line-height: 1.45;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.01em;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* =====================================================
   BARRA SUPERIOR (buscador)
   ===================================================== */
.top-bar {
    flex: 0 0 auto;
    position: relative;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--vidrio);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--vidrio-linea);
}

/* Espacio reservado para el boton flotante "Menu" del contenedor.
   Solo existe cuando la pagina va dentro del iframe. */
.menu-spacer { display: none; }
body.en-iframe .menu-spacer {
    display: block;
    flex: 0 0 100%;
    height: var(--menu-reserva);
}

.brand { display: none; }

.search-hero {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
}
.search-hero input {
    width: 100%;
    height: 46px;
    padding: 0 44px 0 42px;
    border-radius: var(--radio-boton);
    border: 1px solid var(--borde);
    background: var(--tarjeta);
    font-size: 16px;             /* evita el zoom automatico en iOS */
    font-family: inherit;
    color: var(--texto-principal);
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
    transition: box-shadow 0.2s, border-color 0.2s;
    -webkit-appearance: none;
    appearance: none;
}
.search-hero input::placeholder { color: var(--texto-terciario); }
.search-hero input:focus {
    outline: none;
    border-color: var(--acento);
    box-shadow: 0 0 0 4px var(--acento-anillo);
}
.search-hero .material-icons.search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--texto-terciario);
    font-size: 21px;
    pointer-events: none;
}
.search-hero .clear-btn {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    border-radius: 50%;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--texto-terciario);
    display: none;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
}
.search-hero .clear-btn:active { background: var(--fondo-suave); color: var(--texto-principal); }
.search-hero .clear-btn.visible { display: flex; }

.btn-icon {
    flex: 0 0 auto;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--borde-suave);
    background: var(--tarjeta);
    color: var(--texto-secundario);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: var(--transicion);
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04);
}
.btn-icon:active { background: var(--fondo-suave); color: var(--texto-principal); }
.btn-icon .material-icons { font-size: 21px; }

/* =====================================================
   CONTENIDO
   ===================================================== */
.main-content {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 0 12px;
}
.layout {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
}
.panel {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: transparent;
    border: none;
    box-shadow: none;
    border-radius: 0;
    overflow: hidden;
}
.panel-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 2px 10px;
}
.panel-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--texto-secundario);
    display: inline-flex;
    align-items: center;
    gap: 6px;
}
.panel-title .material-icons { font-size: 17px; color: var(--acento); }
.panel-count {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--texto-secundario);
    background: var(--tarjeta);
    border: 1px solid var(--borde-suave);
    padding: 3px 10px;
    border-radius: var(--radio-boton);
}

.results-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 2px 0 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.results-list::-webkit-scrollbar { width: 0; height: 0; }

/* =====================================================
   TARJETAS DE PRODUCTO
   ===================================================== */
.prod-card {
    background: var(--tarjeta);
    border: 1px solid var(--borde-suave);
    border-radius: var(--radio-tarjeta);
    box-shadow: var(--sombra-tarjeta);
    padding: 12px 14px 13px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.14s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.15s ease;
}
.prod-card:active { transform: scale(0.985); background: var(--tarjeta-suave); }
.prod-card.active {
    border-color: var(--acento);
    box-shadow: 0 0 0 3px var(--acento-anillo), var(--sombra-tarjeta);
}

.prod-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.prod-codigo {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--acento-texto);
    background: var(--acento-suave);
    border: 1px solid var(--acento-borde);
    border-radius: 8px;
    padding: 3px 8px;
    letter-spacing: 0;
    max-width: 62%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.prod-badges {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
}
.badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 8px;
    border-radius: var(--radio-boton);
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: -0.005em;
    white-space: nowrap;
}
.badge-info    { background: var(--acento-suave);  color: var(--acento-texto);  border: 1px solid var(--acento-borde); }
.badge-success { background: var(--exito-suave);   color: var(--exito-texto);   border: 1px solid var(--exito-borde); }
.badge-warning { background: var(--alerta-suave);  color: var(--alerta-texto);  border: 1px solid var(--alerta-borde); }
.badge-danger  { background: var(--peligro-suave); color: var(--peligro-texto); border: 1px solid var(--peligro-borde); }

.prod-desc {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.32;
    color: var(--texto-principal);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.prod-foot {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}
.chip {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--texto-secundario);
    background: var(--fondo-suave);
    border: 1px solid var(--borde-suave);
    border-radius: var(--radio-boton);
    padding: 3px 9px;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
}
.prod-precio {
    margin-left: auto;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--texto-principal);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}

/* =====================================================
   ESTADOS VACIOS / CARGA
   ===================================================== */
.detail-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    min-height: 240px;
    padding: 40px 24px;
    text-align: center;
    color: var(--texto-secundario);
}
.detail-empty .material-icons {
    font-size: 52px;
    color: var(--texto-terciario);
    opacity: 0.55;
    margin-bottom: 14px;
}
.detail-empty h3 {
    font-size: 16.5px;
    font-weight: 700;
    color: var(--texto-principal);
    margin-bottom: 6px;
}
.detail-empty p { font-size: 13.5px; max-width: 340px; line-height: 1.55; }

.loading-state {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--texto-secundario);
    gap: 10px;
    font-size: 13.5px;
}
.spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--borde);
    border-top-color: var(--acento);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* =====================================================
   DETALLE (hoja inferior en movil)
   ===================================================== */
.detail-content {
    flex: 1 1 auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
}
.detail-header {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--borde-suave);
}
.detail-code-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
}
.detail-code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--acento-texto);
    letter-spacing: 0;
    background: var(--acento-suave);
    border: 1px solid var(--acento-borde);
    padding: 3px 10px;
    border-radius: 8px;
}
.detail-desc {
    font-size: 18px;
    font-weight: 700;
    color: var(--texto-principal);
    line-height: 1.3;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
}
.detail-meta { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radio-boton);
    background: var(--fondo-suave);
    color: var(--texto-secundario);
    border: 1px solid var(--borde-suave);
}
.meta-chip .material-icons { font-size: 13px; opacity: 0.7; }

.detail-section { padding: 14px 16px; border-bottom: 1px solid var(--borde-suave); }
.detail-section:last-child { border-bottom: none; padding-bottom: 28px; }
.section-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--texto-terciario);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
}
.section-title .material-icons { font-size: 15px; opacity: 0.75; }

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 8px;
}
.stats-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.stat-card {
    background: var(--fondo-suave);
    border-radius: var(--radio-suave);
    padding: 11px 12px;
    border: 1px solid var(--borde-suave);
    min-width: 0;
}
.stat-label {
    font-size: 11px;
    color: var(--texto-secundario);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 4px;
}
.stat-label .material-icons { font-size: 13px; opacity: 0.7; }
.stat-value {
    font-size: 19px;
    font-weight: 700;
    color: var(--texto-principal);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
}

.md-pedido-ok-section { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.md-pedido-ok-card {
    padding: 13px 12px;
    border-radius: var(--radio-suave);
    background: var(--fondo-suave);
    border: 1px solid var(--borde-suave);
    transition: var(--transicion);
    min-width: 0;
}
.md-pedido-ok-card.ok {
    background: linear-gradient(135deg, var(--exito-suave) 0%, #F0FBF3 100%);
    border-color: var(--exito-borde);
}
.md-pedido-ok-header {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--texto-secundario);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.md-pedido-ok-header .material-icons { font-size: 14px; opacity: 0.7; }
.md-pedido-ok-num {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 10px;
    color: var(--texto-terciario);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
}
.md-pedido-ok-card.ok .md-pedido-ok-num { color: var(--exito-texto); }
.md-pedido-ok-explicacion { font-size: 11.5px; line-height: 1.5; color: var(--texto-secundario); }

.md-motivo-principal {
    padding: 8px 10px;
    background: rgba(255,255,255,0.7);
    border-radius: 8px;
    font-size: 11.5px;
    color: var(--texto-principal);
    font-weight: 500;
    display: flex;
    gap: 6px;
    align-items: flex-start;
    margin-bottom: 8px;
    line-height: 1.45;
}
.md-motivo-principal .material-icons {
    color: var(--exito-texto);
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 1px;
}

.md-desglose { display: flex; flex-wrap: wrap; gap: 5px; }
.md-desglose-chip {
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 10px;
    background: rgba(255,255,255,0.8);
    color: var(--texto-secundario);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    border: 1px solid rgba(0,0,0,0.05);
}
.md-desglose-chip.ganador {
    background: var(--exito);
    color: #fff;
    font-weight: 700;
    border-color: var(--exito);
}

.md-motivos { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
.md-motivos li {
    padding: 0;
    display: flex;
    gap: 6px;
    align-items: flex-start;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--texto-secundario);
}
.md-motivos li .material-icons { font-size: 13px; margin-top: 1px; color: var(--alerta-texto); flex-shrink: 0; }
.md-motivos li.sin-motivos { font-style: italic; opacity: 0.7; }
.md-motivos li.sin-motivos .material-icons { color: var(--texto-terciario); }

.prov-list { display: flex; flex-direction: column; gap: 8px; }
.prov-item {
    display: grid;
    grid-template-columns: 30px minmax(0,1fr) auto;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    background: var(--fondo-suave);
    border-radius: var(--radio-suave);
    border: 1px solid var(--borde-suave);
    transition: var(--transicion);
}
.prov-item.best {
    background: linear-gradient(135deg, var(--exito-suave) 0%, #F0FBF3 100%);
    border-color: var(--exito-borde);
}
.prov-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    font-size: 11.5px;
    font-weight: 700;
    color: var(--texto-secundario);
    font-variant-numeric: tabular-nums;
}
.prov-item.best .prov-rank { background: var(--exito); color: #fff; border-color: var(--exito); }
.prov-info { min-width: 0; }
.prov-name {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--texto-principal);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.prov-price {
    font-size: 15px;
    font-weight: 700;
    color: var(--texto-principal);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
    text-align: right;
}
.prov-exist {
    grid-column: 2 / 4;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-top: 2px;
}
.prov-exist-num {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--texto-principal);
    font-variant-numeric: tabular-nums;
}
.stock-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border-radius: var(--radio-boton);
}
.stock-tag.ok   { background: var(--exito-suave);   color: var(--exito-texto);   border: 1px solid var(--exito-borde); }
.stock-tag.low  { background: var(--alerta-suave);  color: var(--alerta-texto);  border: 1px solid var(--alerta-borde); }
.stock-tag.zero { background: var(--peligro-suave); color: var(--peligro-texto); border: 1px solid var(--peligro-borde); }
.best-tag {
    font-size: 10px;
    font-weight: 700;
    color: var(--exito-texto);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 3px;
}
.best-tag .material-icons { font-size: 12px; }

.alert {
    padding: 13px 14px;
    border-radius: var(--radio-suave);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    line-height: 1.5;
    border: 1px solid transparent;
}
.alert-warning { background: var(--alerta-suave); color: var(--alerta-texto); border-color: var(--alerta-borde); }
.alert-danger  { background: var(--peligro-suave); color: var(--peligro-texto); border-color: var(--peligro-borde); }
.alert .material-icons { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

/* =====================================================
   MODAL / HOJA DE DETALLE
   ===================================================== */
.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,0.40);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; animation: fadeIn 0.18s ease; }
.modal {
    position: relative;
    width: 100%;
    max-height: 92dvh;
    background: var(--tarjeta);
    border-radius: 22px 22px 0 0;
    outline: none;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: sheetUp 0.26s cubic-bezier(0.16,1,0.3,1);
}
.modal.dragging { transition: none; animation: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes popIn { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }

.modal-handle {
    flex: 0 0 auto;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    cursor: grab;
}
.modal-handle::before {
    content: '';
    width: 38px;
    height: 4px;
    border-radius: 2px;
    background: var(--borde);
}
.modal-close {
    position: absolute;
    top: 20px;
    right: 10px;
    z-index: 3;
    background: var(--fondo-suave);
}
.modal .detail-header { padding-right: 62px; }

/* =====================================================
   TOASTS
   ===================================================== */
.toast-container {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 14px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}
.toast {
    padding: 12px 16px;
    border-radius: var(--radio-suave);
    background: var(--texto-principal);
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
    max-width: none;
    animation: slideIn 0.3s cubic-bezier(0.25,0.1,0.25,1);
}
.toast .material-icons { font-size: 18px; }
.toast.success { background: var(--exito-texto); }
.toast.warning { background: var(--alerta-texto); }
.toast.danger  { background: var(--peligro-texto); }
@keyframes slideIn { from { transform: translateY(140%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* =====================================================
   PANTALLA ANCHA (>= 901px)
   ===================================================== */
@media (min-width: 901px) {
    .top-bar {
        flex-wrap: nowrap;
        gap: 14px;
        padding: 0 24px;
        height: var(--header-h);
    }
    .menu-spacer { display: none; }
    body.en-iframe .menu-spacer {
        display: block;
        flex: 0 0 112px;
        height: auto;
    }
    .search-hero { flex: 1 1 auto; max-width: 720px; margin: 0 auto; }
    .search-hero input { height: 40px; font-size: 15px; padding: 0 42px 0 42px; }
    .search-hero .material-icons.search-icon { left: 14px; font-size: 20px; }
    .btn-icon { width: 36px; height: 36px; border-color: transparent; background: transparent; box-shadow: none; }
    .btn-icon:hover { background: var(--fondo-suave); color: var(--texto-principal); }
    .search-hero .clear-btn:hover { background: var(--fondo-suave); color: var(--texto-principal); }
    .prod-card:hover { box-shadow: 0 2px 6px rgba(16,24,40,0.06), 0 10px 24px rgba(16,24,40,0.08); border-color: var(--borde); }

    .main-content { padding: 0 24px; }
    .panel-header { padding: 16px 2px 12px; }

    .results-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
        align-content: start;
        padding: 2px 0 28px;
    }
    .results-list::-webkit-scrollbar { width: 10px; }
    .results-list::-webkit-scrollbar-thumb {
        background: var(--borde);
        border-radius: 5px;
        border: 3px solid var(--fondo);
    }
    .detail-content::-webkit-scrollbar { width: 10px; }
    .detail-content::-webkit-scrollbar-thumb {
        background: var(--borde);
        border-radius: 5px;
        border: 3px solid var(--tarjeta);
    }

    .detail-header { padding: 24px 28px 20px; }
    .detail-desc { font-size: 20px; }
    .detail-section { padding: 20px 28px; }
    .stat-value { font-size: 24px; }
    .stat-card { padding: 14px 16px; }
    .stats-grid { gap: 10px; }
    .md-pedido-ok-section { gap: 12px; }
    .md-pedido-ok-card { padding: 16px; }
    .md-pedido-ok-num { font-size: 34px; }
    .prov-item { grid-template-columns: 36px minmax(0,1fr) auto auto; gap: 12px; padding: 12px 14px; }
    .prov-exist { grid-column: auto; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 92px; margin-top: 0; }

    .modal-overlay { align-items: center; padding: 24px; }
    .modal {
        max-width: 760px;
        max-height: calc(100dvh - 48px);
        border-radius: var(--radio-medio);
        box-shadow: 0 24px 60px rgba(0,0,0,0.25);
        animation: popIn 0.22s cubic-bezier(0.25,0.1,0.25,1);
    }
    .modal-handle { display: none; }
    .modal-close { top: 12px; right: 12px; }

    .toast-container { left: auto; right: 24px; bottom: 24px; }
    .toast { max-width: 360px; }
    @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
}

/* =====================================================
   AJUSTES FINOS POR ANCHO
   ===================================================== */
@media (max-width: 360px) {
    :root { --menu-reserva: 44px; }
    .main-content { padding: 0 10px; }
    .prod-card { padding: 11px 12px 12px; }
    .prod-desc { font-size: 14px; }
    .md-pedido-ok-num { font-size: 22px; }

}

@media (max-height: 480px) and (max-width: 900px) {

    .top-bar { padding: 6px 12px; gap: 6px; }
    .search-hero input { height: 40px; }
    .modal { max-height: 96dvh; }
}

/* =====================================================
   ACCESIBILIDAD
   ===================================================== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
.prod-card:focus-visible,
.btn-icon:focus-visible,
.search-hero input:focus-visible {

}

<body>

<header class="top-bar">
    <!-- Espacio reservado para el boton "Menu" flotante del contenedor (solo en iframe) -->
    <div class="menu-spacer" aria-hidden="true"></div>

    <div class="search-hero">
        <span class="material-icons search-icon">search</span>
        <input type="text" id="searchInput" placeholder="Buscar Producto..."
               autocomplete="off" inputmode="search" enterkeyhint="search" aria-label="Buscar producto">
        <button class="clear-btn" id="clearSearch" aria-label="Limpiar">
            <span class="material-icons">close</span>
        </button>
    </div>

    <button class="btn-icon" id="btnRefresh" title="Actualizar datos" aria-label="Actualizar datos">

    </button>

<main class="main-content">
    <div class="layout">

            <div class="panel-header">
                <span class="panel-title">
                    <span class="material-icons">inventory_2</span>Medicamentos
                </span>
                <span class="panel-count" id="resultsCount">0</span>
            </div>
            <div class="results-list" id="resultsList">
                <div class="loading-state"><div class="spinner"></div>Cargando datos...</div>
            </div>
        </section>
    </div>
</main>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Detalle del medicamento" tabindex="-1">
        <div class="modal-handle" id="modalHandle" aria-hidden="true"></div>
        <button class="btn-icon modal-close" id="modalClose" aria-label="Cerrar">
            <span class="material-icons">close</span>
        </button>
        <div class="detail-content" id="detailContent"></div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ========== DETECCIÓN DE IFRAME ==========
// Si la página se abre dentro del contenedor (index2.html) reservamos el
// espacio del botón flotante "Menú" para que no tape el buscador.
(function () {
    try { if (window.self !== window.top) document.body.classList.add('en-iframe'); }
    catch (e) { document.body.classList.add('en-iframe'); }
})();

// ========== UTILIDADES ==========
function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    const div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
}
function escapeAttr(str) {
    return String(str ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normTxt(s) {
    return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function formatCurrency(amount) {
    const n = Number(amount) || 0;
    return '$' + n.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function debounce(fn, ms) {
    let t;
    return function (...args) {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), ms);
    };
}

// ========== ABREVIATURAS DE MARCA / LÍNEA ==========
const MARCA_ABREV = {
    'MEDICAMENTO GRUPO SSA IV': 'GRUPO IV',
    'MEDICAMENTO OTC LIBRE VENTA': 'GRUPO VI',
    'PRODUCTOS DE CURACION EN GENERAL': 'CURA',
    'PRODUCTOS DE REBOTICA': 'REBOTICA',
    'PRODUCTOS EN GENERAL DE ABARROTERAS': 'ABARROTES'
};
const LINEA_ABREV = {
    'ABARROTES EN GENERAL': 'ABARROTES',
    'BEBE': 'BEBE',
    'BIBERONES': 'BIBERON',
    'COMESTIBLES': 'COMESTIBLE',
    'CREMAS': 'CREMA',
    'CURA': 'CURA',
    'DES CABALLERO': 'DESOD',
    'DES DAMA': 'DESOD',
    'ENJUAGUES BUCALES': 'BUCAL',
    'ESTETICA': 'ESTETICA',
    'FARMACIA': 'FARMACIA',
    'HIG': 'HIG',
    'HUMEDAS': 'HUMEDAS',
    'LECHES': 'LECHES',
    'MAMP': 'MAMP',
    'MANT': 'MANT',
    'MCRM': 'MCRM',
    'MEDJABON': 'MJBN',
    'MGOT': 'MGOT',
    'MSUPO': 'MSUPO',
    'MSUSP': 'MSUSP',
    'MTAB': 'MTAB',
    'PAÑALES': 'PAÑAL',
    'REBOTICA': 'REBOTICA',
    'REFRESCOS': 'REFRES',
    'REFRIGERADOS': 'REFRIG',
    'SANITARIAS': 'SANITARIA',
    'SHAMPOO': 'SHAMPOO',
    'TOCADOR': 'TOCADOR',
    'TRATAMIENTO CAPILAR': 'ESTETICA',
    'MED ENCARGO': 'ENCARGO'
};

function abrevMarca(marca) {
    const raw = String(marca ?? '').trim();
    if (!raw) return '';
    const k = raw.toUpperCase();
    return MARCA_ABREV[k] || raw;
}
function abrevLinea(linea) {
    const raw = String(linea ?? '').trim();
    if (!raw) return '';
    const k = raw.toUpperCase();
    return LINEA_ABREV[k] || raw;
}

// ========== CONSTANTES PEDIDO OK ==========
const PEDIDO_MATRIZ_OK_MARCAS = new Set([
    'MEDICAMENTO GRUPO SSA IV', 'MEDICAMENTO OTC LIBRE VENTA', 'PRODUCTOS DE CURACION EN GENERAL',
    'PRODUCTOS DE REBOTICA', 'PRODUCTOS EN GENERAL DE ABARROTERAS'
]);
const PEDIDO_MATRIZ_OK_LINEAS = new Set([
    'ABARROTES EN GENERAL','BEBE','BIBERONES','COMESTIBLES','CREMAS','CURA','DES CABALLERO','DES DAMA',
    'ENJUAGUES BUCALES','ESTETICA','FARMACIA','HIG','HUMEDAS','LECHES','MAMP','MANT','MCRM','MEDJABON',
    'MGOT','MSUPO','MSUSP','MTAB','PAÑALES','REBOTICA','REFRESCOS','REFRIGERADOS','SANITARIAS','SHAMPOO',
    'TOCADOR','TRATAMIENTO CAPILAR','MED ENCARGO'
]);

// ========== DATOS GLOBALES ==========
let productos = [];
let proveedores = [];
let indiceProveedores = new Map();
let indiceProveedoresDesc = new Map();
let proveedoresOrden = new Map();
let productosUnificados = [];
let seleccionActual = null;
let stockLineaGlobal = {};
let costosMatriz = new Map();

// ========== COSTOS MATRIZ ==========
async function cargarCostos() {
    const obj = await DB.costos.cargar();
    return new Map(Object.entries(obj));
}
function conIVA(monto, impuestoPct) {
    return (Number(monto) || 0) * (1 + (Number(impuestoPct) || 0) / 100);
}

// ========== CARGA GENERAL ==========
async function cargarTodo(soloInventario) {
    const [prod, sl, prov, costos] = await Promise.all([
        DB.articulos.cargar().catch(e => { console.warn('Error leyendo productos:', e); return []; }),
        DB.stockLinea.cargar().catch(() => ({})),
        (soloInventario && proveedores.length) ? Promise.resolve(proveedores)
            : DB.proveedores.cargar().catch(e => { console.warn('Error leyendo proveedores:', e); return []; }),
        cargarCostos().catch(e => { console.warn('Error leyendo costos_matriz:', e); return costosMatriz; })
    ]);
    productos = prod; stockLineaGlobal = sl; proveedores = prov; costosMatriz = costos;
    reconstruirIndice();
}

// ========== ÍNDICES ==========
function reconstruirIndice() {
    indiceProveedores = new Map();
    indiceProveedoresDesc = new Map();
    proveedoresOrden = new Map();

    proveedores.forEach((p, i) => {
        proveedoresOrden.set(p.nombre, i);
        if (!Array.isArray(p.productos)) return;
        p.productos.forEach(prod => {
            if (!prod || prod.codigo === undefined || prod.codigo === null) return;
            const key = String(prod.codigo);

            if (!indiceProveedores.has(key)) indiceProveedores.set(key, []);
            indiceProveedores.get(key).push({
                proveedor: p.nombre,
                precio: Number(prod.precio) || 0,
                existencia: Number(prod.existencia) || 0,
                stockMinimo: p.stockMinimo,
                activarStock: !!p.activarStock
            });

            const desc = String(prod.descripcion || '').trim();
            if (desc) {
                const existing = indiceProveedoresDesc.get(key);
                if (!existing || desc.length > existing.length) {
                    indiceProveedoresDesc.set(key, desc);
                }
            }
        });
    });

    construirProductosUnificados();
}

function construirProductosUnificados() {
    const mapa = new Map();

    for (const p of productos) {
        const key = String(p.codigo);
        mapa.set(key, {
            codigo: p.codigo,
            articulo: p.articulo || '',
            linea: p.linea || '',
            marca: p.marca || '',
            ubicacion: p.ubicacion || '',
            fabricante: p.fabricante || '',
            fabricanteSucursal: p.fabricanteSucursal || '',
            existenciaAlmacen: Number(p.existenciaAlmacen) || 0,
            existenciaMatriz: Number(p.existenciaMatriz) || 0,
            existenciaSucursal: Number(p.existenciaSucursal) || 0,
            ventasMatriz: Number(p.ventasMatriz) || 0,
            ventasSucursal: Number(p.ventasSucursal) || 0,
            stockEditado: p.stockEditado || { almacen: 0, matriz: 0, sucursal: 0 },
            noDisponibleMatriz: !!p.noDisponibleMatriz,
            noDisponibleSucursal: !!p.noDisponibleSucursal,
            _binario: p,
            existeEnBinario: true
        });
    }

    for (const [codigo, ops] of indiceProveedores.entries()) {
        if (mapa.has(codigo)) continue;
        const desc = indiceProveedoresDesc.get(codigo) || 'Sin descripción';
        mapa.set(codigo, {
            codigo: codigo,
            articulo: desc,
            linea: '',
            marca: '',
            ubicacion: '',
            fabricante: '',
            fabricanteSucursal: '',
            existenciaAlmacen: 0,
            existenciaMatriz: 0,
            existenciaSucursal: 0,
            ventasMatriz: 0,
            ventasSucursal: 0,
            stockEditado: { almacen: 0, matriz: 0, sucursal: 0 },
            noDisponibleMatriz: false,
            noDisponibleSucursal: false,
            _binario: null,
            existeEnBinario: false
        });
    }

    productosUnificados = Array.from(mapa.values());
}

// ========== PROVEEDORES ==========
function cumpleStockMinimo(op) {
    const umbral = op.activarStock ? (Number(op.stockMinimo) || 20) : 20;
    return (Number(op.existencia) || 0) > umbral;
}

function obtenerOpcionesProveedor(codigo) {
    const entries = indiceProveedores.get(String(codigo)) || [];
    const opciones = entries.map(e => ({ ...e }));
    opciones.sort((a, b) => {
        const d = a.precio - b.precio;
        if (Math.abs(d) > 0.0001) return d;
        const oa = proveedoresOrden.get(a.proveedor);
        const ob = proveedoresOrden.get(b.proveedor);
        return (oa === undefined ? 9999 : oa) - (ob === undefined ? 9999 : ob);
    });
    return opciones;
}

function mejorProveedor(opciones) {
    return opciones.find(cumpleStockMinimo) || null;
}

// ========== PEDIDO OK — CÁLCULO ==========
function esPedidoMatrizOK(item) {
    const fab = (item.fabricante || '').trim().toUpperCase();
    if (fab !== 'SYS') return false;
    const marca = (item.marca || '').trim().toUpperCase();
    if (!PEDIDO_MATRIZ_OK_MARCAS.has(marca)) return false;
    const linea = (item.linea || '').trim().toUpperCase();
    if (!PEDIDO_MATRIZ_OK_LINEAS.has(linea)) return false;
    return true;
}
function esPedidoSucursalOK(item) {
    const fab = (item.fabricanteSucursal || '').trim().toUpperCase();
    if (fab !== 'SYS') return false;
    const marca = (item.marca || '').trim().toUpperCase();
    if (!PEDIDO_MATRIZ_OK_MARCAS.has(marca)) return false;
    const linea = (item.linea || '').trim().toUpperCase();
    if (!PEDIDO_MATRIZ_OK_LINEAS.has(linea)) return false;
    return true;
}

function calcularValores(item) {
    const indMatriz = item.stockEditado?.matriz || 0;
    const indSucursal = item.stockEditado?.sucursal || 0;
    const linea = item.linea || 'Sin línea';
    const stockMatriz = Math.max(indMatriz, stockLineaGlobal[linea]?.matriz || 0);
    const stockSucursal = Math.max(indSucursal, stockLineaGlobal[linea]?.sucursal || 0);
    const ventasTotales = item.ventasMatriz + item.ventasSucursal;

    let invMatriz = item.ventasMatriz > 0 ? Math.ceil((item.ventasMatriz / 180) * 7) : 0;
    let invSucursal = item.ventasSucursal > 0 ? Math.ceil((item.ventasSucursal / 180) * 7) : 0;
    let rangoMatriz = ventasTotales >= 91 ? 3 : ventasTotales >= 61 ? 2 : ventasTotales >= 7 ? 1 : 0;
    let rangoSucursal = ventasTotales >= 91 ? 3 : ventasTotales >= 61 ? 2 : ventasTotales >= 21 ? 1 : 0;
    const mayorMatriz = Math.max(invMatriz, stockMatriz, rangoMatriz);
    const mayorSucursal = Math.max(invSucursal, stockSucursal, rangoSucursal);

    const rawAlmacen = item.existenciaAlmacen || 0;
    const rawMatriz = item.existenciaMatriz || 0;
    const rawSucursal = item.existenciaSucursal || 0;

    let pedidoAlmacen = 0 - rawAlmacen;
    let pedidoMatriz = mayorMatriz - rawMatriz;
    let pedidoSucursal = mayorSucursal - rawSucursal;

    if (item.noDisponibleMatriz) pedidoMatriz = 0;
    if (item.noDisponibleSucursal) pedidoSucursal = 0;

    let surtidoAlmacenAMatriz = 0, surtidoAlmacenASucursal = 0, surtidoMatrizASucursal = 0, surtidoSucursalAMatriz = 0;
    if (pedidoAlmacen < 0 && pedidoMatriz > 0) { const abs = Math.abs(pedidoAlmacen); surtidoAlmacenAMatriz = pedidoMatriz <= abs ? pedidoMatriz : abs; }
    if (pedidoAlmacen < 0 && pedidoSucursal > 0) { const neto = Math.abs(pedidoAlmacen) - surtidoAlmacenAMatriz; if (neto > 0) surtidoAlmacenASucursal = pedidoSucursal <= neto ? pedidoSucursal : neto; }
    if (pedidoMatriz < 0 && pedidoSucursal > 0) { const nec = pedidoSucursal - surtidoAlmacenASucursal; if (nec > 0) surtidoMatrizASucursal = Math.min(Math.abs(pedidoMatriz), nec); }
    if (pedidoSucursal < 0 && pedidoMatriz > 0) { const exc = Math.abs(pedidoSucursal); surtidoSucursalAMatriz = pedidoMatriz <= exc ? pedidoMatriz : exc; }

    const sinSurtidos = surtidoAlmacenAMatriz === 0 && surtidoAlmacenASucursal === 0 && surtidoMatrizASucursal === 0 && surtidoSucursalAMatriz === 0;
    let pedidoMatrizOk = 0, pedidoSucursalOk = 0;
    if (esPedidoMatrizOK(item) && sinSurtidos && pedidoMatriz > 0) pedidoMatrizOk = pedidoMatriz;
    if (esPedidoSucursalOK(item) && sinSurtidos && pedidoSucursal > 0) pedidoSucursalOk = pedidoSucursal;

    return {
        stockMatriz, stockSucursal, invMatriz, invSucursal,
        rangoMatriz, rangoSucursal, mayorMatriz, mayorSucursal,
        pedidoAlmacen, pedidoMatriz, pedidoSucursal,
        surtidoAlmacenAMatriz, surtidoAlmacenASucursal, surtidoMatrizASucursal, surtidoSucursalAMatriz,
        pedidoMatrizOk, pedidoSucursalOk
    };
}

function analizarPedido(item, ubicacion) {
    const v = calcularValores(item);
    const esMatriz = ubicacion === 'matriz';
    const pedidoOk = esMatriz ? v.pedidoMatrizOk : v.pedidoSucursalOk;
    const resultado = { pedido: pedidoOk, esPositivo: pedidoOk > 0, motivoPrincipal: '', desglose: [], motivos: [] };

    const ind = esMatriz ? (item.stockEditado?.matriz || 0) : (item.stockEditado?.sucursal || 0);
    const stockLineaVal = stockLineaGlobal[item.linea]?.[ubicacion] || 0;
    const inv = esMatriz ? v.invMatriz : v.invSucursal;
    const rango = esMatriz ? v.rangoMatriz : v.rangoSucursal;
    const mayor = esMatriz ? v.mayorMatriz : v.mayorSucursal;

    resultado.desglose = [
        { label: 'Inv. ventas', valor: inv },
        { label: 'Stock art.', valor: ind },
        { label: 'Stock línea', valor: stockLineaVal },
        { label: 'Rango ventas', valor: rango }
    ];

    if (resultado.esPositivo) {
        const candidatos = [];
        if (inv === mayor && inv > 0) candidatos.push('inventario calculado por ventas (' + inv + ' pzas)');
        if (ind === mayor && ind > 0) candidatos.push('stock capturado del artículo (' + ind + ' pzas)');
        if (stockLineaVal === mayor && stockLineaVal > 0) candidatos.push('stock asignado a la línea "' + abrevLinea(item.linea) + '" (' + stockLineaVal + ' pzas)');
        if (rango === mayor && rango > 0) candidatos.push('rango de ventas (' + rango + ')');

        if (candidatos.length === 0) {
            resultado.motivoPrincipal = 'Se pide para cubrir el requerimiento calculado (' + mayor + ' pzas).';
        } else if (candidatos.length === 1) {
            resultado.motivoPrincipal = 'Se pide por ' + candidatos[0] + '.';
        } else {
            resultado.motivoPrincipal = 'Se pide por el mayor de: ' + candidatos.join(' / ') + '.';
        }
        return resultado;
    }

    const noDisp = esMatriz ? item.noDisponibleMatriz : item.noDisponibleSucursal;
    if (noDisp) {
        resultado.motivos.push({ icono: 'block', texto: 'Artículo marcado como NO DISPONIBLE.' });
    }

    const pedidoBase = esMatriz ? v.pedidoMatriz : v.pedidoSucursal;
    const existencia = esMatriz ? item.existenciaMatriz : item.existenciaSucursal;

    if (pedidoBase <= 0) {
        resultado.motivos.push({
            icono: 'check_circle',
            texto: 'No necesita pedido: la existencia en ' + (esMatriz ? 'matriz' : 'sucursal') + ' (' + existencia + ') ya cubre el requerimiento (' + mayor + ').'
        });
        return resultado;
    }

    if (esMatriz) {
        if (v.surtidoAlmacenAMatriz > 0) {
            const total = v.surtidoAlmacenAMatriz;
            const parcial = total < v.pedidoMatriz ? ' (parcial: ' + total + ' de ' + v.pedidoMatriz + ' pzas)' : ' (cubre total)';
            resultado.motivos.push({ icono: 'local_shipping', texto: 'Cubierto por surtido del ALMACÉN (ALM→MAT: ' + total + ' pzas)' + parcial + '.' });
        }
        if (v.surtidoSucursalAMatriz > 0) {
            const total = v.surtidoSucursalAMatriz;
            const parcial = total < v.pedidoMatriz ? ' (parcial: ' + total + ' de ' + v.pedidoMatriz + ' pzas)' : ' (cubre total)';
            resultado.motivos.push({ icono: 'local_shipping', texto: 'Cubierto por surtido de SUCURSAL (SUC→MAT: ' + total + ' pzas)' + parcial + '.' });
        }
        if (v.surtidoAlmacenAMatriz === 0 && v.surtidoSucursalAMatriz === 0) {
            const extras = [];
            if (v.surtidoAlmacenASucursal > 0) extras.push('ALM→SUC: ' + v.surtidoAlmacenASucursal);
            if (v.surtidoMatrizASucursal > 0) extras.push('MAT→SUC: ' + v.surtidoMatrizASucursal);
            if (extras.length > 0) {
                resultado.motivos.push({ icono: 'local_shipping', texto: 'Existe surtido activo en la red (' + extras.join(', ') + '); el sistema no genera pedido OK si hay cualquier surtido pendiente.' });
            }
        }
    } else {
        if (v.surtidoAlmacenASucursal > 0) {
            const total = v.surtidoAlmacenASucursal;
            const parcial = total < v.pedidoSucursal ? ' (parcial: ' + total + ' de ' + v.pedidoSucursal + ' pzas)' : ' (cubre total)';
            resultado.motivos.push({ icono: 'local_shipping', texto: 'Cubierto por surtido del ALMACÉN (ALM→SUC: ' + total + ' pzas)' + parcial + '.' });
        }
        if (v.surtidoMatrizASucursal > 0) {
            const total = v.surtidoMatrizASucursal;
            const parcial = total < v.pedidoSucursal ? ' (parcial: ' + total + ' de ' + v.pedidoSucursal + ' pzas)' : ' (cubre total)';
            resultado.motivos.push({ icono: 'local_shipping', texto: 'Cubierto por surtido de MATRIZ (MAT→SUC: ' + total + ' pzas)' + parcial + '.' });
        }
        if (v.surtidoAlmacenASucursal === 0 && v.surtidoMatrizASucursal === 0) {
            const extras = [];
            if (v.surtidoAlmacenAMatriz > 0) extras.push('ALM→MAT: ' + v.surtidoAlmacenAMatriz);
            if (v.surtidoSucursalAMatriz > 0) extras.push('SUC→MAT: ' + v.surtidoSucursalAMatriz);
            if (extras.length > 0) {
                resultado.motivos.push({ icono: 'local_shipping', texto: 'Existe surtido activo en la red (' + extras.join(', ') + '); el sistema no genera pedido OK si hay cualquier surtido pendiente.' });
            }
        }
    }

    const fab = esMatriz ? (item.fabricante || '') : (item.fabricanteSucursal || '');
    if (fab.trim().toUpperCase() !== 'SYS') {
        resultado.motivos.push({ icono: 'factory', texto: 'Fabricante "' + (fab.trim() || '(vacío)') + '" no elegible (solo SYS genera pedido).' });
    }
    const marca = (item.marca || '').trim();
    if (!PEDIDO_MATRIZ_OK_MARCAS.has(marca.toUpperCase())) {
        resultado.motivos.push({ icono: 'verified', texto: 'Marca "' + (abrevMarca(marca) || '(vacía)') + '" no elegible para pedido.' });
    }
    const linea = (item.linea || '').trim();
    if (!PEDIDO_MATRIZ_OK_LINEAS.has(linea.toUpperCase())) {
        resultado.motivos.push({ icono: 'category', texto: 'Línea "' + (abrevLinea(linea) || '(vacía)') + '" no elegible para pedido.' });
    }

    return resultado;
}

// ========== BÚSQUEDA ==========
function buscar(query) {
    const q = normTxt(query).trim();
    if (!q) return [];
    const exact = [], startsWith = [], contains = [], desc = [];
    for (const item of productosUnificados) {
        const code = normTxt(item.codigo);
        const description = normTxt(item.articulo);
        if (code === q) exact.push(item);
        else if (code.startsWith(q)) startsWith.push(item);
        else if (code.includes(q)) contains.push(item);
        else if (description.includes(q)) desc.push(item);
    }
    return [...exact, ...startsWith, ...contains, ...desc];
}

const MAX_RESULTS = 200;

function renderLista(items) {
    const listEl = document.getElementById('resultsList');
    const countEl = document.getElementById('resultsCount');

    if (!items || items.length === 0) {
        countEl.textContent = '0';
        if (productosUnificados.length === 0) {
            listEl.innerHTML = `
                <div class="detail-empty" style="padding: 30px 20px;">
                    <span class="material-icons">folder_off</span>
                    <h3>Sin artículos cargados</h3>
                    <p>Abre <strong>BINARIO</strong> y carga los Excel, y/o abre <strong>COTIZACIÓN</strong> y agrega proveedores.</p>
                </div>`;
        } else {
            listEl.innerHTML = `
                <div class="detail-empty" style="padding: 30px 20px;">
                    <span class="material-icons">search_off</span>
                    <h3>Sin resultados</h3>
                    <p>No se encontraron artículos que coincidan con tu búsqueda.</p>
                </div>`;
        }
        return;
    }

    countEl.textContent = items.length > MAX_RESULTS
        ? `${MAX_RESULTS} de ${items.length}`
        : String(items.length);

    const visible = items.slice(0, MAX_RESULTS);
    const html = visible.map(item => {
        const opciones = obtenerOpcionesProveedor(item.codigo);
        const esFDC = opciones.length === 0;
        const conStock = opciones.filter(cumpleStockMinimo).length;

        let badges = '';
        if (!item.existeEnBinario) {
            badges += '<span class="badge badge-info">Solo prov.</span>';
        }
        if (esFDC) {
            badges += '<span class="badge badge-warning">FDC</span>';
        } else if (conStock > 0) {
            badges += `<span class="badge badge-success">${conStock} stock</span>`;
        } else {
            badges += `<span class="badge badge-danger">Sin stock</span>`;
        }

        const lineaAbv = item.linea ? abrevLinea(item.linea) : '';
        const marcaAbv = item.marca ? abrevMarca(item.marca) : '';

        const cm = costosMatriz.get(String(item.codigo));
        const precioTxt = cm ? formatCurrency(conIVA(cm.precio, cm.impuesto)) : '';

        const isActive = seleccionActual === String(item.codigo);
        return `
            <article class="prod-card ${isActive ? 'active' : ''}" data-codigo="${escapeAttr(item.codigo)}"
                     role="button" tabindex="0" aria-label="${escapeAttr(item.articulo || 'Sin descripción')}">
                <div class="prod-top">
                    <span class="prod-codigo">${escapeHtml(item.codigo)}</span>
                    <div class="prod-badges">${badges}</div>
                </div>
                <div class="prod-desc" title="${escapeAttr(item.articulo)}">${escapeHtml(item.articulo || 'Sin descripción')}</div>
                <div class="prod-foot">
                    ${lineaAbv ? `<span class="chip">${escapeHtml(lineaAbv)}</span>` : ''}
                    ${marcaAbv ? `<span class="chip">${escapeHtml(marcaAbv)}</span>` : ''}
                    ${precioTxt ? `<span class="prod-precio">${escapeHtml(precioTxt)}</span>` : ''}
                </div>
            </article>`;
    }).join('');

    listEl.innerHTML = html;

    const abrir = (el) => {
        const codigo = el.dataset.codigo;
        const item = productosUnificados.find(p => String(p.codigo) === codigo);
        if (item) seleccionar(item);
    };

    listEl.querySelectorAll('.prod-card').forEach(el => {
        el.addEventListener('click', () => abrir(el));
        el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(el); }
        });
        el.classList.toggle('active', el.dataset.codigo === seleccionActual);
    });
}

    seleccionActual = String(item.codigo);

    modalOverlay.querySelector('.modal').focus({ preventScroll: true });
}
function cerrarModal() { modalOverlay.classList.remove('open'); }
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) cerrarModal(); });
document.getElementById('modalClose').addEventListener('click', cerrarModal);

    if (e.key === 'Escape' && modalAbierto()) { e.stopPropagation(); cerrarModal(); }
}, true);

// ===== DESLIZAR HACIA ABAJO PARA CERRAR (movil) =====
(function () {
    const modal = modalOverlay.querySelector('.modal');
    const handle = document.getElementById('modalHandle');
    if (!handle) return;
    let inicioY = null, delta = 0;

    const mover = (dy) => {
        modal.style.transform = dy > 0 ? `translateY(${dy}px)` : '';
    };

    handle.addEventListener('touchstart', (e) => {
        inicioY = e.touches[0].clientY;
        delta = 0;
        modal.classList.add('dragging');
    }, { passive: true });

    handle.addEventListener('touchmove', (e) => {
        if (inicioY === null) return;
        delta = e.touches[0].clientY - inicioY;
        mover(delta);
    }, { passive: true });

    handle.addEventListener('touchend', () => {
        if (inicioY === null) return;
        modal.classList.remove('dragging');
        modal.style.transform = '';
        if (delta > 90) cerrarModal();
        inicioY = null;
        delta = 0;
    });
})();

function renderPedidoCard(resultado, titulo, iconName) {
    const isOk = resultado.esPositivo;
    const cls = isOk ? 'ok' : 'zero';
    let contenido = '';

    if (isOk) {
        const mayor = Math.max.apply(null, resultado.desglose.map(d => d.valor));
        contenido = `<div class="md-motivo-principal">
                         <span class="material-icons">check_circle</span>
                         <span>${escapeHtml(resultado.motivoPrincipal)}</span>
                     </div>
                     <div class="md-desglose">
                         ${resultado.desglose.map(d => {
                             const g = (d.valor === mayor && d.valor > 0) ? 'ganador' : '';
                             return `<span class="md-desglose-chip ${g}">${escapeHtml(d.label)}: ${d.valor}</span>`;
                         }).join('')}
                     </div>`;
    } else {
        if (resultado.motivos.length === 0) {
            contenido = `<ul class="md-motivos"><li class="sin-motivos"><span class="material-icons">info</span><span>Sin motivo específico.</span></li></ul>`;
        } else {

                `<li><span class="material-icons">${m.icono}</span><span>${escapeHtml(m.texto)}</span></li>`
            ).join('')}</ul>`;
        }
    }

    return `<div class="md-pedido-ok-card ${cls}">
                <div class="md-pedido-ok-header"><span class="material-icons">${iconName}</span>${escapeHtml(titulo)}</div>
                <div class="md-pedido-ok-num">${resultado.pedido}</div>
                <div class="md-pedido-ok-explicacion">${contenido}</div>

function renderProveedores(opciones, mejor) {
    const html = opciones.map((op, i) => {
        const isBest = mejor === op;
        const ex = Number(op.existencia) || 0;
        let stockTag = '';
        if (ex === 0) stockTag = '<span class="stock-tag zero">Sin stock</span>';
        else if (!cumpleStockMinimo(op)) stockTag = '<span class="stock-tag low">Stock bajo</span>';
        else stockTag = '<span class="stock-tag ok">Disponible</span>';

        const bestBadge = isBest
            ? `<div class="best-tag"><span class="material-icons">check_circle</span>Mejor opción</div>`
            : '';

        return `
            <div class="prov-item ${isBest ? 'best' : ''}">
                <div class="prov-rank">#${i + 1}</div>
                <div class="prov-info">
                    <div class="prov-name">${escapeHtml(op.proveedor)}</div>
                    ${bestBadge}
                </div>
                <div class="prov-price">${formatCurrency(op.precio)}</div>
                <div class="prov-exist">
                    <span class="prov-exist-num">${ex}</span>
                    ${stockTag}
                </div>
            </div>`;
    }).join('');
    return `<div class="prov-list">${html}</div>`;
}

// ========== TOASTS ==========
function showToast(msg, type = 'info', duration = 2600) {
    const container = document.getElementById('toastContainer');
    while (container.children.length >= 3) container.removeChild(container.firstChild);
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    const icons = { success: 'check_circle', warning: 'warning', danger: 'error', info: 'info' };
    toast.innerHTML = `<span class="material-icons">${icons[type] || 'info'}</span><span>${escapeHtml(msg)}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse forwards';
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearSearch');

const handleSearch = debounce(() => {
    const q = searchInput.value.trim();
    clearBtn.classList.toggle('visible', q.length > 0);

    if (q.length === 0) {
        if (productosUnificados.length > 0) {
            renderLista(productosUnificados.slice(0, 50));
        } else {
            renderLista([]);
        }
        return;
    }

    const results = buscar(q);
    renderLista(results);
}, 180);

searchInput.addEventListener('input', handleSearch);

searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        searchInput.value = '';
        handleSearch();
    } else if (e.key === 'Enter') {
        const results = buscar(searchInput.value.trim());
        if (results.length > 0) seleccionar(results[0]);
    }
});

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchInput.focus();
    handleSearch();
});

async function recargarDatos() {
    await cargarTodo();

    if (productosUnificados.length === 0) {
        if (productos.length === 0 && proveedores.length === 0) {
            document.getElementById('resultsList').innerHTML = `
                <div class="detail-empty" style="padding: 30px 20px;">
                    <span class="material-icons">cloud_off</span>
                    <h3>Sin datos disponibles</h3>
                    <p>Para comenzar:<br>

                       2. Abre <strong>COTIZACIÓN</strong> y agrega proveedores.</p>
                </div>`;
        } else {
            document.getElementById('resultsList').innerHTML = `
                <div class="detail-empty" style="padding: 30px 20px;">
                    <span class="material-icons">folder_off</span>
                    <h3>Sin códigos válidos</h3>
                    <p>Los proveedores cargados no contienen productos con código válido.</p>
                </div>`;
        }
        return;
    }

    if (proveedores.length === 0) {

    } else {
        renderLista(productosUnificados.slice(0, 50));
    }
}

                if (seleccionActual && modalAbierto()) {
                    const found = productosUnificados.find(p => String(p.codigo) === seleccionActual);
                    if (found) renderDetalle(found);
                }
            } else if (productosUnificados.length > 0) {
                renderLista(productosUnificados.slice(0, 50));
            }
        }).catch(() => {});
    }
});
</script>

</body>
</html>
