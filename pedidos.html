<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos del día · Farmacias ADN</title>
<script src="db.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --fondo:#F5F6F3; --tarjeta:#FFFFFF; --tinta:#17231D; --tenue:#66716A; --linea:#E2E6E1;
  --matriz:#1D5A9E; --matriz-bg:#E3EEF9; --suc:#A4480A; --suc-bg:#FBEBDD; --peligro:#B3261E;
}
@media (prefers-color-scheme:dark){
  :root{ --fondo:#0F1612; --tarjeta:#18211C; --tinta:#EDF1EE; --tenue:#98A39C; --linea:#26322B;
    --matriz:#8DBCF0; --matriz-bg:#1A2E44; --suc:#F2B27F; --suc-bg:#40291A; --peligro:#F2877F; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--fondo);color:var(--tinta);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--fondo);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;border-bottom:1px solid var(--linea)}
.fila1{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:19px;margin:0;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--tenue)}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.btn-act{border:1px solid var(--linea);background:var(--tarjeta);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px;background:var(--linea);padding:3px;border-radius:12px}
.seg button{padding:8px 4px;border-radius:9px;font-size:14px;font-weight:600;color:var(--tenue)}
.seg button.on{background:var(--tarjeta);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fila{display:flex;gap:8px;margin-top:8px}
.fila input,.fila select{flex:1;min-width:0;font-size:16px;padding:9px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--tarjeta)}
.vista{border:1px solid var(--linea);background:var(--tarjeta);border-radius:10px;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap}
:focus-visible{outline:2px solid var(--matriz);outline-offset:1px}
.resumen{display:flex;gap:18px;padding:12px 14px 4px}
.resumen b{display:block;font-size:26px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.resumen span{font-size:12px;color:var(--tenue)}
main{padding:6px 12px calc(96px + env(safe-area-inset-bottom,0px))}
.estado{padding:40px 16px;text-align:center;color:var(--tenue)}
.estado.error{color:var(--peligro)}
.caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .nom{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
summary .nom small{display:block;font-weight:500;font-size:12px;color:var(--tenue);margin-top:1px}
summary .tot{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
summary .tot small{display:block;font-size:11px;font-weight:500;color:var(--tenue);margin-top:3px}
.item{padding:11px 14px;border-top:1px solid var(--linea)}
.caja>.item:first-child{border-top:0}
.arriba{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.desc{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.cod{font-size:12px;color:var(--tenue);overflow-wrap:anywhere;margin-top:1px}
.abajo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.etq{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.matriz{background:var(--matriz-bg);color:var(--matriz)}
.tag.sucursal{background:var(--suc-bg);color:var(--suc)}
.tag.prov{background:var(--linea);font-weight:600}
.tag.sug{font-weight:500;color:var(--tenue);border:1px dashed var(--linea)}
.x{flex:none;width:36px;height:36px;border-radius:10px;border:1px solid var(--linea);color:var(--peligro);font-size:16px;font-weight:700}
.paso{flex:none;display:flex;align-items:center;border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.paso button{width:40px;height:38px;font-size:20px;font-weight:700;background:var(--fondo)}
.paso input{width:52px;height:38px;border:0;border-left:1px solid var(--linea);border-right:1px solid var(--linea);text-align:center;font-size:17px;font-weight:700;background:var(--tarjeta);-moz-appearance:textfield}
.paso input::-webkit-outer-spin-button,.paso input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pie{font-size:12px;color:var(--tenue);text-align:center;padding:4px 16px}
.barra{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--fondo);border-top:1px solid var(--linea);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.gen{width:100%;padding:14px;border-radius:12px;background:var(--tinta);color:var(--fondo);font-size:16px;font-weight:700}
.gen:disabled{opacity:.45;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90vw;background:var(--tinta);color:var(--fondo);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:9;display:none}
</style>
</head>
<body>
<header>
  <div class="fila1">
    <div><h1>Pedidos del día</h1><div class="sub" id="act">Sin cargar</div></div>
    <button class="btn-act" id="btnAct">Actualizar</button>
  </div>
  <div class="seg" id="seg">
    <button data-s="todos" class="on">Todos</button>
    <button data-s="matriz">Matriz</button>
    <button data-s="sucursal">Sucursal</button>
  </div>
  <div class="fila">
    <select id="selProv" aria-label="Filtrar por proveedor"><option value="">Todos los proveedores</option></select>
    <button class="vista" id="btnVista">Ver lista</button>
  </div>
  <div class="fila"><input id="q" type="search" placeholder="Buscar artículo, código o proveedor" autocomplete="off"></div>
</header>
<div class="resumen" id="resumen"></div>
<main id="main"><div class="estado">Cargando pedidos…</div>
  <div class="pie">La etiqueta punteada indica un proveedor sugerido por mejor precio con existencia. Los cambios de piezas y los artículos quitados solo se aplican al generar el pedido; al actualizar se pierden.</div>
</main>
<div class="barra"><button class="gen" id="btnGen" disabled>Elige un proveedor para generar el pedido</button></div>
<div id="toast" role="status"></div>

<script>
let filas = [], suc = 'todos', q = '', vista = 'proveedor', prov = '', sucio = false;
let ordenProv = new Map(), provIds = new Map(), abierto = new Map();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const nf = new Intl.NumberFormat('es-MX');
const mxn = n => '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const SIN = 'Sin proveedor';
const rank = n => n === SIN ? 1e9 : (ordenProv.has(n) ? ordenProv.get(n) : 1e8);

let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 3200); }

async function cargar() {
  $('#btnAct').disabled = true;
  $('#main').firstElementChild.outerHTML = '<div class="estado">Cargando pedidos…</div>';
  try {
    const [pm, ps, provs] = await Promise.all([
      DB.pedidos.cargar('matriz'), DB.pedidos.cargar('sucursal'),
      DB.req('GET', 'proveedores?select=id,nombre,orden&order=orden')
    ]);
    const nombres = new Map(provs.map(p => [p.id, p.nombre]));
    ordenProv = new Map(provs.map((p, i) => [p.nombre, i]));
    provIds = new Map(provs.map(p => [p.nombre, p.id]));
    filas = [...pm.map(p => ({ ...p, tipo: 'matriz' })), ...ps.map(p => ({ ...p, tipo: 'sucursal' }))];
    filas.forEach((f, i) => {
      f.id = i; f.orig = f.piezas;
      f.proveedor = f.proveedorSeleccionado || f.proveedorMostrado || f.proveedor || '';
      f.sugerido = false;
    });
    // Sin proveedor elegido: se sugiere el de mejor precio con existencia
    const faltan = [...new Set(filas.filter(f => !f.proveedor).map(f => String(f.codigo)))];
    const mejor = new Map();
    for (let i = 0; i < faltan.length; i += 50) {
      const lote = faltan.slice(i, i + 50).map(c => '"' + c.replace(/"/g, '\\"') + '"').join(',');
      const rows = await DB.req('GET', 'proveedor_productos?select=codigo,precio,existencia,proveedor_id&codigo=in.(' + encodeURIComponent(lote) + ')&limit=1000');
      (rows || []).forEach(r => {
        if (!(Number(r.existencia) > 0) || !(Number(r.precio) > 0)) return;
        const act = mejor.get(r.codigo);
        if (!act || Number(r.precio) < act.precio) mejor.set(r.codigo, { precio: Number(r.precio), nombre: nombres.get(r.proveedor_id) });
      });
    }
    filas.forEach(f => {
      if (f.proveedor) return;
      const m = mejor.get(String(f.codigo));
      if (m && m.nombre) { f.proveedor = m.nombre; f.sugerido = true; } else f.proveedor = SIN;
    });
    // Opciones del filtro de proveedor
    const lista = [...new Set(filas.map(f => f.proveedor))].sort((a, b) => rank(a) - rank(b) || a.localeCompare(b, 'es'));
    if (prov && !lista.includes(prov)) prov = '';
    $('#selProv').innerHTML = '<option value="">Todos los proveedores</option>' +
      lista.map(n => '<option value="' + esc(n) + '"' + (n === prov ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
    sucio = false;
    $('#act').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    pintar();
  } catch (e) {
    $('#main').firstElementChild.outerHTML = '<div class="estado error">No se pudieron cargar los pedidos.<br>' + esc(e.message) + '</div>';
  } finally { $('#btnAct').disabled = false; }
}

function visibles() {
  const t = norm(q);
  return filas.filter(f => (suc === 'todos' || f.tipo === suc) && (!prov || f.proveedor === prov) &&
    (!t || norm(f.descripcion + ' ' + f.codigo + ' ' + f.proveedor).includes(t)));
}
const tagSuc = t => '<span class="tag ' + t + '">' + (t === 'matriz' ? 'Matriz' : 'Sucursal') + '</span>';

function itemHtml(f, mostrarProv) {
  return '<div class="item" data-id="' + f.id + '">' +
    '<div class="arriba"><div class="desc">' + esc(f.descripcion || 'Sin descripción') + '</div>' +
    '<button class="x" data-a="del" aria-label="Quitar artículo del pedido">✕</button></div>' +
    '<div class="cod">' + esc(f.codigo) + (f.linea ? ' · ' + esc(f.linea) : '') +
    (f.piezas !== f.orig ? ' · pedido original: ' + f.orig : '') + '</div>' +
    '<div class="abajo"><div class="etq">' + tagSuc(f.tipo) +
    (mostrarProv ? '<span class="tag prov">' + esc(f.proveedor) + '</span>' + (f.sugerido ? '<span class="tag sug">sugerido</span>' : '') : '') + '</div>' +
    '<div class="paso"><button data-a="menos" aria-label="Quitar una pieza">−</button>' +
    '<input type="number" inputmode="numeric" min="1" value="' + f.piezas + '" data-a="n" aria-label="Piezas">' +
    '<button data-a="mas" aria-label="Agregar una pieza">+</button></div></div></div>';
}

function pintar() {
  const v = visibles();
  const piezas = v.reduce((a, f) => a + f.piezas, 0);
  $('#resumen').innerHTML = '<div><b>' + nf.format(v.length) + '</b><span>artículos</span></div>' +
    '<div><b>' + nf.format(piezas) + '</b><span>piezas</span></div>' +
    '<div><b>' + new Set(v.map(f => f.proveedor)).size + '</b><span>proveedores</span></div>';

  const g = $('#btnGen');
  if (prov && prov !== SIN) {
    const nm = filas.filter(f => f.proveedor === prov && f.tipo === 'matriz').length;
    const ns = filas.filter(f => f.proveedor === prov && f.tipo === 'sucursal').length;
    g.disabled = !(nm + ns);
    g.textContent = 'Generar pedido de ' + prov + ' (' + nm + ' Matriz · ' + ns + ' Sucursal)';
  } else { g.disabled = true; g.textContent = 'Elige un proveedor para generar el pedido'; }

  const cont = $('#main').firstElementChild;
  let html;
  if (!v.length) html = '<div class="estado">No hay pedidos que mostrar.</div>';
  else if (vista === 'lista') {
    const orden = [...v].sort((a, b) => String(a.descripcion).localeCompare(String(b.descripcion), 'es'));
    html = '<div class="caja">' + orden.map(f => itemHtml(f, true)).join('') + '</div>';
  } else {
    const grupos = new Map();
    v.forEach(f => { if (!grupos.has(f.proveedor)) grupos.set(f.proveedor, []); grupos.get(f.proveedor).push(f); });
    const porDefecto = grupos.size <= 3 || !!q;
    html = [...grupos.entries()].sort((a, b) => rank(a[0]) - rank(b[0]) || a[0].localeCompare(b[0], 'es')).map(([nom, arr]) => {
      const pz = arr.reduce((a, f) => a + f.piezas, 0);
      const nm = arr.filter(f => f.tipo === 'matriz').length, ns = arr.length - nm;
      const det = [nm ? nm + ' Matriz' : '', ns ? ns + ' Sucursal' : ''].filter(Boolean).join(' y ');
      arr.sort((a, b) => a.tipo.localeCompare(b.tipo) || String(a.descripcion).localeCompare(String(b.descripcion), 'es'));
      const abre = abierto.has(nom) ? abierto.get(nom) : porDefecto;
      return '<details class="caja" data-g="' + esc(nom) + '"' + (abre ? ' open' : '') + '><summary><div class="nom">' + esc(nom) +
        '<small>' + arr.length + ' artículos · ' + det + '</small></div><div class="tot">' + nf.format(pz) + '<small>piezas</small></div></summary>' +
        arr.map(f => itemHtml(f, false)).join('') + '</details>';
    }).join('');
  }
  // El primer hijo de main es el contenedor de la lista; el aviso queda al final
  cont.outerHTML = '<div id="lista">' + html + '</div>';
}

/* ---- edición: quitar artículo / cambiar piezas ---- */
function cambiar(id, fn) { const f = filas.find(x => x.id === id); if (!f) return; fn(f); pintar(); }
$('#main').addEventListener('click', e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const it = b.closest('.item'); if (!it) return;
  const id = Number(it.dataset.id);
  if (b.dataset.a === 'mas') { sucio = true; cambiar(id, f => f.piezas += 1); }
  else if (b.dataset.a === 'menos') { sucio = true; cambiar(id, f => f.piezas = Math.max(1, f.piezas - 1)); }
  else if (b.dataset.a === 'del') {
    const f = filas.find(x => x.id === id);
    if (f && confirm('¿Quitar “' + (f.descripcion || f.codigo) + '” del pedido de ' + (f.tipo === 'matriz' ? 'Matriz' : 'Sucursal') + '?')) {
      sucio = true; filas = filas.filter(x => x.id !== id); pintar();
    }
  }
});
$('#main').addEventListener('change', e => {
  if (e.target.dataset.a !== 'n') return;
  const id = Number(e.target.closest('.item').dataset.id);
  sucio = true; cambiar(id, f => f.piezas = Math.max(1, Math.floor(Number(e.target.value)) || 1));
});
$('#main').addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.g) abierto.set(e.target.dataset.g, e.target.open); }, true);

/* ---- generar pedido (PDF con Matriz y Sucursal del proveedor filtrado) ---- */
const cargarScript = url => new Promise((ok, no) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function asegurarPDF() {
  const base = () => !!(window.jspdf && window.jspdf.jsPDF);
  const auto = () => base() && !!window.jspdf.jsPDF.API.autoTable;
  if (!base()) { try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); } catch (_) {} }
  if (base() && !auto()) { try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js'); } catch (_) {} }
  return base() && auto();
}
const NOMBRES_PDF = {
  'FARMACOS': 'FARMACOS NACIONALES', 'FARMATER': 'FARMACEUTICOS TENORIO', 'ALMACEN': 'ALMACEN DE DROGAS',
  'EVITAL': 'ENLACE VITAL', 'ROSARIOS': 'MEDICINAS ROSARIO', 'FLIVE PACHUCA': 'FARMALIVE PACHUCA',
  'PHARMAMIGO': 'FARMAMIGO', 'FLIVE PUEBLA': 'FARMALIVE PUEBLA', 'JEMEDI': 'COMERCIALIZADORA JEMEDI'
};
const nombrePDF = n => NOMBRES_PDF[String(n).trim().toUpperCase()] || n;
const C = { PRIMARY: [0,113,227], SUCCESS: [52,199,89], DARK: [29,29,31], MUTED: [110,110,115], LIGHT: [245,245,247], WHITE: [255,255,255], BORDER: [220,225,222] };
const estilos = head => ({
  styles: { font: 'helvetica', fontSize: 8.5, cellPadding: { top: 2, bottom: 2, left: 4, right: 3 }, textColor: C.DARK, lineColor: C.BORDER, lineWidth: .2, overflow: 'linebreak', halign: 'left' },
  headStyles: { fillColor: head, textColor: C.WHITE, fontStyle: 'bold', fontSize: 9, halign: 'left', cellPadding: { top: 2.5, bottom: 2.5, left: 4, right: 3 } },
  alternateRowStyles: { fillColor: C.LIGHT }, showFoot: 'lastPage', tableWidth: 182,
  columnStyles: { 0: { cellWidth: 30, fontStyle: 'bold' }, 1: { cellWidth: 98, overflow: 'ellipsis' }, 2: { cellWidth: 14, fontStyle: 'bold' }, 3: { cellWidth: 22 }, 4: { cellWidth: 22, fontStyle: 'bold' } }
});

async function generar() {
  if (!prov || prov === SIN) return;
  const im = filas.filter(f => f.proveedor === prov && f.tipo === 'matriz');
  const is = filas.filter(f => f.proveedor === prov && f.tipo === 'sucursal');
  if (!im.length && !is.length) { toast('No hay artículos de ' + prov); return; }
  const g = $('#btnGen'); g.disabled = true; g.textContent = 'Generando…';
  try {
    if (!(await asegurarPDF())) throw new Error('No se pudo cargar la librería de PDF');
    const precios = new Map();
    const id = provIds.get(prov);
    if (id) ((await DB.req('POST', 'rpc/productos_de_proveedor', { p_id: id })) || []).forEach(x => precios.set(String(x.codigo), Number(x.precio) || 0));

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF(), W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 14;
    const nombre = nombrePDF(prov);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...C.DARK); doc.text(nombre, M, 14);
    doc.setDrawColor(...C.PRIMARY); doc.setLineWidth(.6); doc.line(M, 18, W - M, 18);
    let y = 26;

    const seccion = (titulo, etiqueta, items, color, fondo, texto) => {
      if (!items.length) return;
      if (y > H - 60 && y > 30) { doc.addPage(); y = 24; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...C.DARK); doc.text(titulo, M, y); y += 4;
      let total = 0;
      const cuerpo = [...items].sort((a, b) => String(a.descripcion).localeCompare(String(b.descripcion), 'es')).map(f => {
        const p = precios.get(String(f.codigo)) || 0, sub = p * f.piezas; total += sub;
        return [f.codigo, f.descripcion || '', f.piezas, p ? mxn(p) : '-', p ? mxn(sub) : '-'];
      });
      doc.autoTable({
        startY: y, head: [['Código', 'Descripción', 'Pzas', 'Precio', 'Subtotal']], body: cuerpo,
        foot: [['', '', { content: etiqueta + ':  ' + mxn(total), colSpan: 3, styles: { halign: 'left', fontStyle: 'bold' } }]],
        margin: { left: M, right: M }, ...estilos(color),
        footStyles: { fillColor: fondo, textColor: texto, fontStyle: 'bold', fontSize: 9, halign: 'left', cellPadding: { top: 2.5, bottom: 2.5, left: 4, right: 3 } }
      });
      y = doc.lastAutoTable.finalY + 10;
    };
    seccion('PEDIDO MATRIZ', 'Total Matriz', im, C.PRIMARY, [234,243,254], C.PRIMARY);
    seccion('PEDIDO SUCURSAL', 'Total Sucursal', is, C.SUCCESS, [232,249,238], [26,122,58]);

    const pags = doc.getNumberOfPages(), fecha = new Date().toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
    for (let i = 1; i <= pags; i++) {
      doc.setPage(i); const fy = H - 10;
      doc.setDrawColor(...C.BORDER); doc.setLineWidth(.3); doc.line(M, fy - 4, W - M, fy - 4);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C.MUTED);
      doc.text('FARMACIAS ADN', M, fy); doc.text('Página ' + i + ' de ' + pags, W / 2, fy, { align: 'center' }); doc.text('Fecha: ' + fecha, W - M, fy, { align: 'right' });
    }
    doc.save(nombre.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0, 10) + '.pdf');
    toast('Pedido generado: ' + im.length + ' Matriz + ' + is.length + ' Sucursal');
  } catch (e) { console.error(e); toast('Error al generar el pedido: ' + e.message); }
  finally { pintar(); }
}

/* ---- controles ---- */
$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  suc = b.dataset.s; [...$('#seg').children].forEach(x => x.classList.toggle('on', x === b)); pintar();
});
$('#selProv').addEventListener('change', e => { prov = e.target.value; pintar(); });
$('#q').addEventListener('input', e => { q = e.target.value; pintar(); });
$('#btnVista').addEventListener('click', e => {
  vista = vista === 'proveedor' ? 'lista' : 'proveedor';
  e.target.textContent = vista === 'proveedor' ? 'Ver lista' : 'Por proveedor'; pintar();
});
$('#btnAct').addEventListener('click', () => {
  if (sucio && !confirm('Al actualizar se pierden tus cambios de piezas y los artículos quitados. ¿Continuar?')) return;
  cargar();
});
$('#btnGen').addEventListener('click', generar);
cargar();
</script>
